<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="title">Calculator</div>
    <div class="calc">    
        <div class="buttons-in-rows">
            <input type="text" class="input-box">
        </div>
        <div class="buttons">
            <div class="buttons-in-rows row1">
                <button onclick="clearInput()">AC</button>
                <button onclick="backspace()">Del</button>
                <button onclick="getExpression('%')">%</button>
                <button onclick="getExpression('+')">+</button>
            </div>
            <div class="buttons-in-rows row2">
                <button onclick="getExpression('9')">9</button>
                <button onclick="getExpression('8')">8</button>
                <button onclick="getExpression('7')">7</button>
                <button onclick="getExpression('-')">-</button>
            </div>
            <div class="buttons-in-rows row3">
                <button onclick="getExpression('6')">6</button>
                <button onclick="getExpression('5')">5</button>
                <button onclick="getExpression('4')">4</button>
                <button onclick="getExpression('*')">x</button>
            </div>
            <div class="buttons-in-rows row4">
                <button onclick="getExpression('3')">3</button>
                <button onclick="getExpression('2')">2</button>
                <button onclick="getExpression('1')">1</button>
                <button onclick="getExpression('/')">/</button>
            </div>
            <div class="buttons-in-rows row5">
                <button onclick="getExpression('0')">0</button>
                <button onclick="getExpression('.')">.</button>
                <button onclick="calculate()">=</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
