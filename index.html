<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="title">Calculator</div>
    <div class="calc">    
        <div>
            <input type="text" class="input-box">
        </div>
        <div class="buttons">
            <div class="buttons-in-rows row1">
                <button>AC</button>
                <button>Del</button>
                <button>%</button>
                <button>+</button>
            </div>
            <div class="buttons-in-rows row2">
                <button>9</button>
                <button>8</button>
                <button>7</button>
                <button>-</button>
            </div>
            <div class="buttons-in-rows row3">
                <button>6</button>
                <button>5</button>
                <button>4</button>
                <button>*</button>
            </div>
            <div class="buttons-in-rows row4">
                <button>3</button>
                <button>2</button>
                <button>1</button>
                <button>/</button>
            </div>
            <div class="buttons-in-rows row5">
                <button>=</button>
                <button>.</button>
                <button>0</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
