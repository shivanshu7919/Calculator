<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="title">Calculator</div>
    <div class="calc">    
        <div class="buttons-in-rows">
            <input type="text" placeholder="Result" class="input-box">
        </div>
        <div class="buttons">
            <div class="buttons-in-rows row1">
                <button class="keyboardButtons">AC</button>
                <button class="keyboardButtons">Del</button>
                <button class="keyboardButtons">%</button>
                <button class="keyboardButtons">+</button>
            </div>
            <div class="buttons-in-rows row2">
                <button class="keyboardButtons">9</button>
                <button class="keyboardButtons">8</button>
                <button class="keyboardButtons">7</button>
                <button class="keyboardButtons">-</button>
            </div>
            <div class="buttons-in-rows row3">
                <button class="keyboardButtons">6</button>
                <button class="keyboardButtons">5</button>
                <button class="keyboardButtons">4</button>
                <button class="keyboardButtons">x</button>
            </div>
            <div class="buttons-in-rows row4">
                <button class="keyboardButtons">3</button>
                <button class="keyboardButtons">2</button>
                <button class="keyboardButtons">1</button>
                <button class="keyboardButtons">/</button>
            </div>
            <div class="buttons-in-rows row5">
                <button class="keyboardButtons">0</button>
                <button class="keyboardButtons">.</button>
                <button class="keyboardButtons">=</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
